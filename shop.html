<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Meza</title>
  <meta name="description" content="Browse the Meza catalog: search, filter by category, brand, price and availability, and sort the collection.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B44D8'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-mount="navbar"></div>

  <main id="main">
    <div class="container">
      <div class="page-head">
        <h1>Shop</h1>
        <p class="muted" data-count aria-live="polite"></p>
      </div>

      <!-- Search: always visible, full width -->
      <div class="search shop-search">
        <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-search"></use></svg>
        <label class="visually-hidden" for="shop-search">Search products</label>
        <input class="field__input" id="shop-search" data-search type="search"
               placeholder="Search name, brand, category…" autocomplete="off">
      </div>

      <div class="shop-layout">
        <!-- Filters: collapsible on mobile (button), sidebar on desktop -->
        <aside class="filters" aria-label="Product filters">
          <button class="filters__toggle" type="button" data-filters-toggle
                  aria-expanded="false" aria-controls="filters-body">
            <span style="display:inline-flex;align-items:center;gap:var(--space-2)">
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-funnel"></use></svg>
              Filters
            </span>
            <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-chevron-down"></use></svg>
          </button>

          <div class="filters__body" id="filters-body" data-filters-body hidden>
            <div class="filter-group">
              <h3>Category</h3>
              <div class="chip-row" data-cats></div>
            </div>

            <div class="filter-group">
              <h3>Brand</h3>
              <div class="chip-row" data-brands></div>
            </div>

            <div class="filter-group">
              <h3>Price (₦)</h3>
              <div class="price-range">
                <div class="field">
                  <label class="field__label visually-hidden" for="price-min">Minimum price</label>
                  <input class="field__input" id="price-min" data-min-input type="number"
                         inputmode="numeric" min="0" step="1000" placeholder="Min">
                </div>
                <div class="field">
                  <label class="field__label visually-hidden" for="price-max">Maximum price</label>
                  <input class="field__input" id="price-max" data-max-input type="number"
                         inputmode="numeric" min="0" step="1000" placeholder="Max">
                </div>
              </div>
              <p class="field__hint">Applied when you leave the field or press Enter.</p>
            </div>

            <div class="filter-group">
              <h3>Availability</h3>
              <div class="chip-row" data-avail></div>
            </div>

            <button class="btn btn--ghost btn--sm" type="button" data-clear-all>
              Clear all filters
            </button>
          </div>
        </aside>

        <!-- Results -->
        <section class="shop-main" aria-label="Products">
          <div class="toolbar">
            <span class="muted" data-count-2></span>
            <label class="sort" for="sort-select">
              <span class="muted">Sort</span>
              <select id="sort-select" data-sort-select></select>
            </label>
          </div>

          <div class="product-grid" data-grid></div>

          <div class="empty" data-empty hidden>
            <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-search"></use></svg>
            <h3>No products match</h3>
            <p>Try a different search term, or clear the filters to see the full collection.</p>
            <button class="btn btn--outline" type="button" data-empty-clear>Clear all filters</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div data-mount="footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
