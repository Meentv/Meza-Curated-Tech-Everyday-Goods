<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist — Meza</title>
  <meta name="description" content="Your saved products on Meza — a fictional demo storefront.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B44D8'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="wishlist">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-mount="navbar"></div>

  <main id="main">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="crumbs__sep" aria-hidden="true"><svg class="icon"><use href="assets/icons/icons.svg#i-chevron-right"></use></svg></span>
        <span aria-current="page">Wishlist</span>
      </nav>

      <div class="page-head">
        <h1>Wishlist</h1>
        <p class="muted" data-count aria-live="polite"></p>
      </div>

      <div class="product-grid" data-grid></div>

      <div class="empty" data-empty hidden>
        <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-heart"></use></svg>
        <h3>Nothing saved yet</h3>
        <p>Tap the heart on any product to save it here for later.</p>
        <a class="btn btn--primary" href="shop.html">Browse the collection</a>
      </div>
    </div>
  </main>

  <div data-mount="footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
