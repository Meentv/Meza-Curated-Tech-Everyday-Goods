<!-- ==========================================================================
     MEZA — icon sprite
     One symbol per icon, 24x24 grid, stroke-based. Shapes intentionally carry
     NO fill/stroke attributes: the consuming page styles them through the
     .icon class in css/styles.css (fill:none; stroke:currentColor), so a single
     icon recolors with its context. Add the filled variant class (see
     styles.css) to fill a shape solid.

     Usage:
       <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-bag"/></svg>
     ========================================================================== -->
