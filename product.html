<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Meza</title>
  <meta name="description" content="Product details on Meza — a fictional demo storefront.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B44D8'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="product">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-mount="navbar"></div>

  <main id="main">
    <div class="container">
      <!-- Breadcrumbs (rendered by js/pages/product.js) -->
      <nav class="crumbs" data-crumbs aria-label="Breadcrumb"></nav>

      <div class="pdp">
        <!-- Gallery -->
        <div class="pdp__gallery" data-gallery tabindex="0" aria-label="Product image gallery — use left and right arrow keys">
          <div class="pdp__stage">
            <img data-stage-img src="" alt="" width="1200" height="1200" fetchpriority="high">
            <span class="badge--flag" data-flag hidden></span>
            <button class="pdp__nav pdp__nav--prev icon-btn" type="button" data-prev aria-label="Previous image">
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-chevron-left"></use></svg>
            </button>
            <button class="pdp__nav pdp__nav--next icon-btn" type="button" data-next aria-label="Next image">
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-chevron-right"></use></svg>
            </button>
          </div>
          <div class="pdp__thumbs" data-thumbs role="group" aria-label="Choose image"></div>
        </div>

        <!-- Info -->
        <div class="pdp__info">
          <p class="card__meta muted" data-brandcat></p>
          <h1 data-name></h1>
          <p class="pdp__price" data-price></p>
          <p class="pdp__avail" data-avail></p>
          <p class="pdp__desc" data-desc></p>

          <div class="pdp__buy">
            <span data-qty-slot></span>
            <button class="btn btn--primary" type="button" data-add>
              Add to cart
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-bag"></use></svg>
            </button>
            <button class="icon-btn pdp__wish" type="button" data-wish aria-pressed="false" aria-label="Add to wishlist">
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-heart"></use></svg>
            </button>
          </div>

          <details class="acc" open>
            <summary>Specifications
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-chevron-down"></use></svg>
            </summary>
            <dl class="specs acc__body" data-specs></dl>
          </details>
          <details class="acc">
            <summary>Shipping &amp; demo note
              <svg class="icon" aria-hidden="true"><use href="assets/icons/icons.svg#i-chevron-down"></use></svg>
            </summary>
            <div class="acc__body">
              <p class="muted">Meza is a demo storefront: checkout is simulated and no payment is
              collected. A flat demo shipping fee applies at checkout, free above ₦150,000.</p>
            </div>
          </details>
        </div>
      </div>

      <!-- Related products -->
      <section class="section" data-related-wrap aria-labelledby="related-title">
        <div class="section-head"><h2 id="related-title">Related products</h2></div>
        <div class="product-grid" data-related></div>
      </section>
    </div>
  </main>

  <div data-mount="footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
